# Tests on every pull request and every push to main, on macOS, where the tool runs. The tests need
# ffmpeg and dvdauthor from Homebrew, swift and say from the runner image, and the hash-locked
# requirements/runtime.txt.
#
# There is no release job yet: nothing is published while the repository is private.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests
    uses: agusgonzaleznic/github-reusable-workflows/.github/workflows/python-tests.yml@0938feb26149788717c639af3d1cf1f3a96ca2c8 # v1.12.0
    with:
      runs-on: macos-15
      python-versions: '["3.12", "3.13"]'
      install-requirements: true
      requirements: requirements/runtime.txt
      brew-packages: ffmpeg dvdauthor
      timeout-minutes: 30
      test-command: .venv/bin/python -m unittest discover -s tests -v
